<script>
const PAGES={"a": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Reflection, Refraction & TIR<\/title>\n<style>\n  body{font-family:Arial;background:#101820;color:#fff;text-align:center;margin:0}\n  canvas{background:#101820;border:1px solid #444}\n  button,select{margin:4px;padding:6px 10px;font-size:14px}\n  #info{height:60px;font-size:17px;color:#ffd166}\n<\/style>\n<\/head>\n<body>\n<h2>Laws of Reflection, Refraction & Total Internal Reflection<\/h2>\n<div>\n  Angle of incidence: <input id=\"ang\" type=\"range\" min=\"0\" max=\"89\" value=\"30\">\n  <span id=\"av\">30\u00b0<\/span>\n  n\u2081 (upper): <select id=\"n1\"><option>1.00<\/option><option>1.33<\/option><option selected>1.50<\/option><option>2.42<\/option><\/select>\n  n\u2082 (lower): <select id=\"n2\"><option>1.00<\/option><option selected>1.33<\/option><option>1.50<\/option><option>2.42<\/option><\/select>\n<\/div>\n<div>\n  <button onclick=\"preset(30,1.0,1.5)\">Refraction: air \u2192 glass<\/button>\n  <button onclick=\"preset(30,1.5,1.0)\">Glass \u2192 air<\/button>\n  <button onclick=\"preset(60,1.5,1.0)\">Total Internal Reflection<\/button>\n  <button onclick=\"preset(40,1.0,1.0001)\">Reflection only<\/button>\n<\/div>\n<div id=\"info\"><\/div>\n<canvas id=\"c\" width=\"800\" height=\"480\"><\/canvas>\n<script>\nconst c=document.getElementById('c'),x=c.getContext('2d');\nconst ang=document.getElementById('ang'),N1=document.getElementById('n1'),N2=document.getElementById('n2');\nconst O={x:400,y:250},L=210;\nlet t=0;\nfunction preset(a,n1,n2){\n  ang.value=a;\n  N1.value=n1.toFixed(2); N2.value=n2<1.001?\"1.00\":n2.toFixed(2);\n}\nfunction pt(a,dir,f){ // a radians from normal; dir: up/down, side\n  return {x:O.x+dir.sx*Math.sin(a)*L*f, y:O.y+dir.sy*Math.cos(a)*L*f};\n}\nfunction ray(p1,p2,col){\n  x.strokeStyle=col;x.lineWidth=3;x.beginPath();x.moveTo(p1.x,p1.y);x.lineTo(p2.x,p2.y);x.stroke();\n}\nfunction dot(p,col){x.fillStyle=col;x.beginPath();x.arc(p.x,p.y,7,0,7);x.fill();}\nfunction lerp(a,b,f){return{x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f};}\nfunction arcLabel(a,sx,sy,txt,col){\n  x.fillStyle=col;x.font=\"15px Arial\";\n  x.fillText(txt,O.x+sx*Math.sin(a/2)*90-(sx<0?30:-5),O.y+sy*Math.cos(a/2)*90);\n}\nfunction draw(){\n  const i=ang.value*Math.PI/180, n1=+N1.value, n2=+N2.value;\n  document.getElementById('av').textContent=ang.value+\"\u00b0\";\n  x.clearRect(0,0,800,480);\n  // media\n  x.fillStyle=\"rgba(120,180,255,\"+(0.08+0.12*(n1-1))+\")\";x.fillRect(0,0,800,O.y);\n  x.fillStyle=\"rgba(120,255,200,\"+(0.08+0.12*(n2-1))+\")\";x.fillRect(0,O.y,800,230);\n  x.fillStyle=\"#fff\";x.font=\"16px Arial\";\n  x.fillText(\"Medium 1: n\u2081 = \"+n1.toFixed(2),15,25);\n  x.fillText(\"Medium 2: n\u2082 = \"+n2.toFixed(2),15,470);\n  // interface & normal\n  ray({x:0,y:O.y},{x:800,y:O.y},\"#ccc\");\n  x.setLineDash([6,6]);ray({x:O.x,y:20},{x:O.x,y:460},\"#aaa\");x.setLineDash([]);\n  x.fillStyle=\"#aaa\";x.fillText(\"Normal\",O.x+8,30);\n  const sr=n1*Math.sin(i)/n2, tir=sr>1;\n  const A=pt(i,{sx:-1,sy:-1},1), R=pt(i,{sx:1,sy:-1},1);\n  ray(A,O,\"#ffd166\");ray(O,R,\"#ff6b6b\");\n  let T=null,r=0;\n  if(!tir){r=Math.asin(sr);T=pt(r,{sx:1,sy:1},1);ray(O,T,\"#4dd0e1\");}\n  arcLabel(i,-1,-1,\"i = \"+ang.value+\"\u00b0\",\"#ffd166\");\n  arcLabel(i,1,-1,\"r' = \"+ang.value+\"\u00b0\",\"#ff6b6b\");\n  if(!tir)arcLabel(r,1,1,\"r = \"+(r*180/Math.PI).toFixed(1)+\"\u00b0\",\"#4dd0e1\");\n  // animated photons\n  t=(t+0.012)%2;\n  if(t<1){dot(lerp(A,O,t),\"#fff\");}\n  else{const f=t-1;dot(lerp(O,R,f),\"#fff\");if(T)dot(lerp(O,T,f),\"#fff\");}\n  // info\n  const crit=n1>n2?Math.asin(n2/n1)*180/Math.PI:null;\n  let s;\n  if(tir)s=\"TOTAL INTERNAL REFLECTION! i > critical angle (\"+crit.toFixed(1)+\"\u00b0). No refracted ray; all light reflects.\";\n  else s=\"Reflection: i = r'.  Refraction (Snell): n\u2081 sin i = n\u2082 sin r \u2192 \"+(r*180/Math.PI).toFixed(1)+\"\u00b0\"+\n      (n2>n1?\" (bends TOWARDS normal)\":n2<n1?\" (bends AWAY from normal)\":\" (no bending)\")+\n      (crit?\"  |  Critical angle = \"+crit.toFixed(1)+\"\u00b0\":\"\");\n  document.getElementById('info').textContent=s;\n  requestAnimationFrame(draw);\n}\ndraw();\n<\/script>\n<\/body>\n<\/html>                                                       \n", "b": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Thermometry: Principles, Types, Applications<\/title>\n<style>\n  body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:20px}\n  h1{text-align:center;margin:0 0 10px}\n  nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:15px}\n  nav button{padding:10px 16px;border:0;border-radius:8px;background:#334155;color:#fff;cursor:pointer;font-size:15px}\n  nav button.active{background:#f97316}\n  .panel{display:none;max-width:900px;margin:auto;background:#1e293b;border-radius:12px;padding:20px}\n  .panel.active{display:block}\n  canvas{background:#0b1220;border-radius:8px;display:block;margin:10px auto;max-width:100%}\n  .row{display:flex;gap:20px;flex-wrap:wrap;align-items:center;justify-content:center}\n  input[type=range]{width:280px}\n  .card{background:#273449;border-radius:8px;padding:10px 14px;margin:6px 0}\n  .card b{color:#fbbf24}\n  select{padding:6px;border-radius:6px}\n<\/style>\n<\/head>\n<body>\n<h1>\ud83c\udf21\ufe0f Thermometry<\/h1>\n<nav>\n  <button class=\"active\" data-t=\"p1\">1. Principles<\/button>\n  <button data-t=\"p2\">2. Types<\/button>\n  <button data-t=\"p3\">3. Examples<\/button>\n  <button data-t=\"p4\">4. Applications<\/button>\n<\/nav>\n\n<!-- PRINCIPLES -->\n<div id=\"p1\" class=\"panel active\">\n  <h2>Principle: Thermometric Property Changes with Temperature<\/h2>\n  <p>Thermometry is the measurement of temperature. A thermometer uses a <b>thermometric property<\/b> (volume, length, resistance, voltage, radiation) that changes predictably with temperature.<\/p>\n  <div class=\"row\">\n    <canvas id=\"c1\" width=\"260\" height=\"360\"><\/canvas>\n    <div>\n      <label>Temperature: <b id=\"tv\">25<\/b> \u00b0C<\/label><br>\n      <input type=\"range\" id=\"temp\" min=\"-20\" max=\"120\" value=\"25\"><br><br>\n      <div class=\"card\">Celsius: <b id=\"cv\">25<\/b> \u00b0C<\/div>\n      <div class=\"card\">Fahrenheit: <b id=\"fv\">77<\/b> \u00b0F &nbsp; <small>F = 9C/5 + 32<\/small><\/div>\n      <div class=\"card\">Kelvin: <b id=\"kv\">298.15<\/b> K &nbsp; <small>K = C + 273.15<\/small><\/div>\n      <label><input type=\"checkbox\" id=\"auto\" checked> Auto-animate<\/label>\n      <p><small>Fixed points: ice point 0 \u00b0C, steam point 100 \u00b0C. Mercury expands as particles gain kinetic energy.<\/small><\/p>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- TYPES -->\n<div id=\"p2\" class=\"panel\">\n  <h2>Types of Thermometers<\/h2>\n  <label>Choose type: <\/label>\n  <select id=\"typeSel\">\n    <option value=\"bimetal\">Bimetallic strip (thermal expansion)<\/option>\n    <option value=\"tc\">Thermocouple (Seebeck effect)<\/option>\n    <option value=\"rtd\">RTD / Thermistor (resistance)<\/option>\n    <option value=\"pyro\">Pyrometer / IR (radiation)<\/option>\n  <\/select>\n  <canvas id=\"c2\" width=\"700\" height=\"280\"><\/canvas>\n  <div class=\"card\" id=\"typeInfo\"><\/div>\n  <label>Temperature: <b id=\"t2v\">100<\/b> \u00b0C<\/label>\n  <input type=\"range\" id=\"t2\" min=\"0\" max=\"500\" value=\"100\">\n<\/div>\n\n<!-- EXAMPLES -->\n<div id=\"p3\" class=\"panel\">\n  <h2>Examples<\/h2>\n  <div class=\"card\"><b>Liquid-in-glass:<\/b> Mercury or alcohol thermometer (\u221239 \u00b0C to 357 \u00b0C for mercury); lab use.<\/div>\n  <div class=\"card\"><b>Clinical thermometer:<\/b> Mercury-in-glass with a constriction; digital ones use thermistors (35\u201342 \u00b0C).<\/div>\n  <div class=\"card\"><b>Gas thermometer:<\/b> Constant-volume hydrogen/helium; very accurate standard.<\/div>\n  <div class=\"card\"><b>Bimetallic:<\/b> Oven dials, thermostats (brass + steel/invar).<\/div>\n  <div class=\"card\"><b>Thermocouple:<\/b> Type K (Ni-Cr/Ni-Al) for furnaces up to ~1300 \u00b0C.<\/div>\n  <div class=\"card\"><b>Platinum RTD (Pt100):<\/b> 100 \u03a9 at 0 \u00b0C; industrial precision, \u2212200 to 850 \u00b0C.<\/div>\n  <div class=\"card\"><b>Infrared thermometer:<\/b> Forehead scanners, food safety checks.<\/div>\n  <div class=\"card\"><b>Optical pyrometer:<\/b> Molten metal, stars (above ~700 \u00b0C).<\/div>\n  <p>Pt100 resistance (approx.): <b>R = 100(1 + 0.00385\u00b7T)<\/b> \u03a9<\/p>\n  <label>T = <b id=\"t3v\">100<\/b> \u00b0C \u2192 R = <b id=\"rv\">138.5<\/b> \u03a9<\/label><br>\n  <input type=\"range\" id=\"t3\" min=\"-200\" max=\"800\" value=\"100\">\n<\/div>\n\n<!-- APPLICATIONS -->\n<div id=\"p4\" class=\"panel\">\n  <h2>Applications<\/h2>\n  <canvas id=\"c4\" width=\"700\" height=\"240\"><\/canvas>\n  <div class=\"card\" id=\"appInfo\"><\/div>\n  <p><small>Click a card icon in the animation, or wait for it to cycle.<\/small><\/p>\n<\/div>\n\n<script>\n// Tabs\ndocument.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{\n  document.querySelectorAll('nav button,.panel').forEach(e=>e.classList.remove('active'));\n  b.classList.add('active');document.getElementById(b.dataset.t).classList.add('active');\n});\n\n// ---------- Panel 1: liquid thermometer ----------\nconst c1=document.getElementById('c1'),x1=c1.getContext('2d');\nconst temp=document.getElementById('temp'),auto=document.getElementById('auto');\nlet dir=1,t0=0;\nfunction draw1(){\n  const T=+temp.value;\n  document.getElementById('tv').textContent=T;\n  document.getElementById('cv').textContent=T;\n  document.getElementById('fv').textContent=(T*9/5+32).toFixed(1);\n  document.getElementById('kv').textContent=(T+273.15).toFixed(2);\n  x1.clearRect(0,0,260,360);\n  // tube\n  x1.fillStyle='#cbd5e1';x1.fillRect(110,30,28,270);\n  x1.beginPath();x1.arc(124,320,30,0,7);x1.fill();\n  // liquid\n  const h=(T+20)/140*250;\n  const col=T>60?'#ef4444':T>25?'#f97316':'#3b82f6';\n  x1.fillStyle=col;x1.fillRect(116,295-h,16,h+10);\n  x1.beginPath();x1.arc(124,320,24,0,7);x1.fill();\n  // ticks\n  x1.fillStyle='#fff';x1.font='12px Arial';\n  for(let t=-20;t<=120;t+=20){const y=295-(t+20)/140*250;\n    x1.fillRect(142,y,10,2);x1.fillText(t+'\u00b0',156,y+4);}\n  // particles\n  const n=14,speed=1+(T+20)/20;\n  for(let i=0;i<n;i++){\n    const px=20+((i*37+t0*speed*(1+i%3))%70),py=300+((i*53+t0*speed*(1+i%2))%50)-10;\n    x1.fillStyle=col;x1.beginPath();x1.arc(px,py+10,4,0,7);x1.fill();\n  }\n}\nfunction loop(){\n  t0+=1;\n  if(auto.checked){temp.value=+temp.value+dir*0.4;\n    if(+temp.value>=120)dir=-1;if(+temp.value<=-20)dir=1;}\n  draw1();\n  draw2();\n  requestAnimationFrame(loop);\n}\n\n// ---------- Panel 2: types ----------\nconst c2=document.getElementById('c2'),x2=c2.getContext('2d');\nconst info={\n bimetal:\"<b>Principle:<\/b> Two metals (e.g., brass and steel) with different expansion coefficients are bonded. Heating bends the strip toward the metal that expands less. <b>Range:<\/b> \u221270 to 500 \u00b0C. <b>Use:<\/b> thermostats, oven dials.\",\n tc:\"<b>Principle:<\/b> Seebeck effect. Two dissimilar wires joined at a hot junction produce a voltage proportional to the temperature difference (V \u2248 \u03b1\u0394T). <b>Range:<\/b> up to ~1800 \u00b0C. <b>Use:<\/b> furnaces, engines.\",\n rtd:\"<b>Principle:<\/b> Metal resistance rises with temperature (RTD, e.g., platinum). Thermistors are semiconductors whose resistance changes sharply. <b>Use:<\/b> digital thermometers, labs, electronics.\",\n pyro:\"<b>Principle:<\/b> Hot objects emit infrared radiation. Intensity \u221d T\u2074 (Stefan\u2013Boltzmann law). No contact is needed. <b>Use:<\/b> molten metals, fever scanning, stars.\"\n};\nconst sel=document.getElementById('typeSel'),t2=document.getElementById('t2');\nfunction draw2(){\n  const T=+t2.value,type=sel.value;\n  document.getElementById('t2v').textContent=T;\n  document.getElementById('typeInfo').innerHTML=info[type];\n  x2.clearRect(0,0,700,280);x2.fillStyle='#fff';x2.font='14px Arial';\n  const heat=T/500,glow='rgb('+(80+175*heat)+','+(80*(1-heat))+',50)';\n  if(type==='bimetal'){\n    x2.fillStyle='#64748b';x2.fillRect(80,100,20,100);\n    const bend=heat*0.6;\n    x2.save();x2.translate(100,150);\n    for(let i=0;i<2;i++){\n      x2.beginPath();x2.lineWidth=12;x2.strokeStyle=i?'#f59e0b':'#94a3b8';\n      const r=1/(bend+0.0001)*300;\n      x2.moveTo(0,i*12-6);\n      x2.bezierCurveTo(150,i*12-6,300,i*12-6-bend*150,400,i*12-6-bend*220);\n      x2.stroke();\n    }\n    x2.restore();\n    x2.fillStyle='#f59e0b';x2.fillText('Brass (expands more)',450,60);\n    x2.fillStyle='#94a3b8';x2.fillText('Steel (expands less)',450,85);\n    x2.fillStyle=glow;x2.beginPath();x2.arc(60,150,25,0,7);x2.fill();\n  }else if(type==='tc'){\n    x2.fillStyle=glow;x2.beginPath();x2.arc(120,140,30,0,7);x2.fill();\n    x2.fillStyle='#fff';x2.fillText('Hot junction',80,195);\n    x2.strokeStyle='#f87171';x2.lineWidth=4;x2.beginPath();x2.moveTo(140,125);x2.lineTo(420,80);x2.stroke();\n    x2.strokeStyle='#60a5fa';x2.beginPath();x2.moveTo(140,155);x2.lineTo(420,200);x2.stroke();\n    x2.fillStyle='#e2e8f0';x2.fillRect(420,70,130,140);\n    x2.fillStyle='#000';x2.font='28px monospace';\n    x2.fillText((0.041*(T-25)).toFixed(2)+' mV',430,150);\n    x2.font='14px Arial';x2.fillStyle='#fff';x2.fillText('Voltmeter (Type K \u2248 41 \u00b5V/\u00b0C)',400,235);\n  }else if(type==='rtd'){\n    x2.fillStyle=glow;x2.fillRect(80,100,80,80);\n    x2.fillStyle='#fff';x2.fillText('Pt100 sensor',80,200);\n    const R=100*(1+0.00385*T);\n    x2.strokeStyle='#fbbf24';x2.lineWidth=3;x2.beginPath();x2.moveTo(160,140);x2.lineTo(300,140);x2.stroke();\n    x2.fillStyle='#e2e8f0';x2.fillRect(300,90,200,100);\n    x2.fillStyle='#000';x2.font='30px monospace';x2.fillText(R.toFixed(1)+' \u03a9',320,150);\n    x2.font='14px Arial';x2.fillStyle='#fff';x2.fillText('Resistance rises linearly with T',300,215);\n  }else{\n    x2.fillStyle=glow;x2.beginPath();x2.arc(130,140,20+30*heat,0,7);x2.fill();\n    x2.strokeStyle='#fde68a';x2.lineWidth=2;\n    for(let i=0;i<6;i++){\n      const off=(performance.now()/10+i*40)%250;\n      x2.beginPath();x2.moveTo(180+off,140+(i-3)*12);x2.lineTo(200+off,140+(i-3)*12);x2.stroke();\n    }\n    x2.fillStyle='#e2e8f0';x2.fillRect(520,100,100,80);\n    x2.fillStyle='#000';x2.font='20px monospace';x2.fillText(T+'\u00b0C',530,148);\n    x2.font='14px Arial';x2.fillStyle='#fff';\n    x2.fillText('Radiated power \u221d T\u2074 (relative): '+Math.pow((T+273)/298,4).toFixed(1)+'\u00d7',180,250);\n  }\n}\n\n// ---------- Panel 3 ----------\nconst t3=document.getElementById('t3');\nt3.oninput=()=>{document.getElementById('t3v').textContent=t3.value;\n  document.getElementById('rv').textContent=(100*(1+0.00385*t3.value)).toFixed(1);};\n\n// ---------- Panel 4 ----------\nconst apps=[\n {i:'\ud83c\udfe5',n:'Medicine',d:'Clinical and infrared thermometers detect fever; incubators and vaccine fridges are monitored (2\u20138 \u00b0C).'},\n {i:'\ud83c\udfed',n:'Industry',d:'Thermocouples control furnaces, steel casting, and chemical reactors.'},\n {i:'\ud83c\udf26\ufe0f',n:'Meteorology',d:'Max-min thermometers and sensors record weather and climate data, for example in Sikkim\\'s varied altitudes.'},\n {i:'\ud83c\udf72',n:'Food safety',d:'Probe thermometers check cooking (\u2265 74 \u00b0C for poultry) and cold storage.'},\n {i:'\ud83d\udd2c',n:'Research',d:'Cryogenic and high-precision RTDs support physics and chemistry experiments.'},\n {i:'\ud83d\ude80',n:'Space & astronomy',d:'Pyrometry estimates the surface temperature of stars and spacecraft parts.'}\n];\nconst c4=document.getElementById('c4'),x4=c4.getContext('2d');let ai=0,last=0;\nfunction draw4(now){\n  if(now-last>3000){ai=(ai+1)%apps.length;last=now;}\n  x4.clearRect(0,0,700,240);x4.textAlign='center';\n  apps.forEach((a,k)=>{\n    const sel=k===ai;\n    x4.font=(sel?'60px':'38px')+' Arial';\n    x4.globalAlpha=sel?1:0.5;\n    x4.fillText(a.i,60+k*116,sel?110+Math.sin(now/200)*6:110);\n    x4.font='13px Arial';x4.fillStyle='#fff';x4.fillText(a.n,60+k*116,170);\n  });\n  x4.globalAlpha=1;x4.textAlign='left';\n  document.getElementById('appInfo').innerHTML='<b>'+apps[ai].n+':<\/b> '+apps[ai].d;\n}\nc4.onclick=e=>{const r=c4.getBoundingClientRect();\n  ai=Math.min(5,Math.floor((e.clientX-r.left)/r.width*700/116));last=performance.now();};\n(function l4(now){draw4(now||0);requestAnimationFrame(l4);})();\n\nloop();\n<\/script>\n<\/body>\n<\/html>", "c": "<!DOCTYPE html>\n<html>\n<head><meta charset=\"utf-8\"><title>Vernier Caliper<\/title>\n<style>\n body{font-family:sans-serif;text-align:center;background:#f7f7fb}\n button,input{font-size:16px;margin:6px}\n #out{font-size:18px;line-height:1.6}\n<\/style><\/head>\n<body>\n<h2>Measuring an Object with a Vernier Caliper<\/h2>\n<div>Object width (mm): <input id=\"w\" type=\"number\" value=\"23.7\" min=\"5\" max=\"80\" step=\"0.1\">\n<button onclick=\"start()\">Measure \u25b6<\/button><\/div>\n<canvas id=\"c\" width=\"1000\" height=\"300\"><\/canvas>\n<div id=\"out\"><\/div>\n<script>\nconst cv=document.getElementById('c'),g=cv.getContext('2d');\nconst X0=60,PX=10,Y=120;           // 1 mm = 10 px\nlet jaw=0,target=0,step=0;\nfunction draw(){\n  g.clearRect(0,0,1000,300);\n  // main scale body\n  g.fillStyle='#cfd8dc';g.fillRect(X0-20,Y-40,900,40);\n  g.fillStyle='#000';g.font='11px sans-serif';\n  for(let i=0;i<=85;i++){\n    const x=X0+i*PX,h=i%10==0?18:(i%5==0?13:8);\n    g.fillRect(x,Y-h,1,h);\n    if(i%10==0)g.fillText(i/10,x-3,Y-22);\n  }\n  g.fillText('cm',X0+870,Y-22);\n  // fixed jaw\n  g.fillStyle='#455a64';g.fillRect(X0-20,Y-40,20,150);\n  // object\n  const w=target/1;\n  g.fillStyle='#ef6c00';g.fillRect(X0,Y+10,w*PX,70);\n  g.fillStyle='#000';g.fillText('Object',X0+w*PX/2-15,Y+50);\n  // movable jaw + vernier\n  const vx=X0+jaw*PX;\n  g.fillStyle='#455a64';g.fillRect(vx,Y,15,110);\n  g.fillStyle='#b3e5fc';g.fillRect(vx,Y,110,40);\n  g.fillStyle='#000';\n  for(let i=0;i<=10;i++){\n    const x=vx+i*9;\n    g.fillRect(x,Y,1,i%5==0?16:10);\n    g.fillText(i,x-3,Y+30);\n  }\n  g.fillStyle='red';g.fillRect(vx-1,Y-45,2,50);g.fillText('Vernier 0',vx-25,Y-50);\n}\nfunction start(){\n  target=parseFloat(document.getElementById('w').value);\n  target=Math.round(target*10)/10;\n  jaw=target+25;step=0;document.getElementById('out').innerHTML='Closing the jaws on the object\u2026';\n  (function anim(){\n    if(jaw>target){jaw=Math.max(target,jaw-0.3);draw();requestAnimationFrame(anim);}\n    else{draw();show();}\n  })();\n}\nfunction show(){\n  const msr=Math.floor(target+1e-9),vsd=Math.round((target-msr)*10);\n  const lc=0.1;\n  const lines=[\n   `<b>Step 1 \u2013 Least count:<\/b> 1 MSD = 1 mm, 10 VSD = 9 mm \u2192 LC = 1 \u2212 0.9 = <b>0.1 mm<\/b>`,\n   `<b>Step 2 \u2013 Main scale reading (MSR):<\/b> last mark before vernier zero = <b>${msr} mm<\/b>`,\n   `<b>Step 3 \u2013 Vernier coincidence:<\/b> the ${vsd}th vernier line aligns with a main-scale line \u2192 VSR = ${vsd}`,\n   `<b>Step 4 \u2013 Reading:<\/b> MSR + VSR \u00d7 LC = ${msr} + ${vsd} \u00d7 0.1 = <b>${(msr+vsd*lc).toFixed(1)} mm<\/b> (${(msr+vsd*lc)/10} cm)`\n  ];\n  const out=document.getElementById('out');out.innerHTML='';\n  let i=0;const t=setInterval(()=>{\n    out.innerHTML+=lines[i++]+'<br>';\n    if(i>=lines.length)clearInterval(t);\n  },1500);\n}\ntarget=23.7;jaw=target;draw();\n<\/script>\n<\/body><\/html>", "e": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Wave Motion Animation<\/title>\n<style>\n  body{font-family:Segoe UI,Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:16px}\n  h1{margin:0 0 10px;font-size:1.5rem}\n  .tabs button{background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:8px 14px;margin:0 4px 6px 0;border-radius:8px;cursor:pointer;font-size:.95rem}\n  .tabs button.active{background:#2563eb;border-color:#60a5fa}\n  canvas{width:100%;max-width:900px;background:#020617;border-radius:10px;border:1px solid #334155;display:block}\n  .controls{margin:10px 0;display:flex;flex-wrap:wrap;gap:18px;align-items:center}\n  .controls label{font-size:.9rem}\n  .panel{max-width:900px;background:#1e293b;border-radius:10px;padding:12px 16px;margin-top:10px;line-height:1.5}\n  .panel h3{margin:.2em 0;color:#7dd3fc}\n  table{border-collapse:collapse;width:100%;font-size:.9rem}\n  td,th{border:1px solid #475569;padding:5px 8px;text-align:left}\n  th{background:#334155}\n  .big{font-size:1.2rem;color:#fde047}\n  button.play{background:#16a34a;color:#fff;border:0;padding:6px 12px;border-radius:6px;cursor:pointer}\n<\/style>\n<\/head>\n<body>\n<h1>\ud83c\udf0a Wave Motion<\/h1>\n<div class=\"tabs\" id=\"tabs\">\n  <button data-m=\"transverse\" class=\"active\">Transverse Wave<\/button>\n  <button data-m=\"longitudinal\">Longitudinal Wave<\/button>\n  <button data-m=\"relation\">v = f\u03bb<\/button>\n  <button data-m=\"sl\">Sound &amp; Light<\/button>\n<\/div>\n<canvas id=\"c\" width=\"900\" height=\"360\"><\/canvas>\n<div class=\"controls\">\n  <label>Frequency: <input type=\"range\" id=\"freq\" min=\"0.5\" max=\"3\" step=\"0.1\" value=\"1\"> <span id=\"fv\">1.0<\/span> Hz<\/label>\n  <label id=\"wlWrap\">Wavelength: <input type=\"range\" id=\"wl\" min=\"0.5\" max=\"3\" step=\"0.1\" value=\"1.5\"> <span id=\"wv\">1.5<\/span> m<\/label>\n  <label>Amplitude: <input type=\"range\" id=\"amp\" min=\"10\" max=\"70\" step=\"1\" value=\"40\"><\/label>\n  <button id=\"pause\" class=\"play\">Pause<\/button>\n  <button id=\"tone\" class=\"play\" style=\"display:none\">\ud83d\udd0a Play tone<\/button>\n<\/div>\n<div class=\"panel\" id=\"info\"><\/div>\n\n<script>\nconst cv=document.getElementById('c'),ctx=cv.getContext('2d');\nconst W=cv.width,H=cv.height,PX=100; // 100 px = 1 m\nlet mode='transverse',paused=false,t=0,last=0;\nconst $=id=>document.getElementById(id);\nconst f=()=>+$('freq').value, wl=()=>+$('wl').value, A=()=>+$('amp').value;\n\nconst INFO={\ntransverse:`<h3>Transverse Waves<\/h3>\n<p><b>Definition:<\/b> particles of the medium vibrate <b>perpendicular<\/b> to the direction the wave travels.<\/p>\n<p><b>Parts:<\/b> crest (highest point), trough (lowest point), amplitude (max displacement from rest), wavelength \u03bb (crest to crest).<\/p>\n<p><b>Examples:<\/b> waves on a string or rope, ripples on water, light and all electromagnetic waves, S-waves in earthquakes.<\/p>\n<p>Watch the <span style=\"color:#f87171\">red particle<\/span>: it only moves up and down while the wave moves right.<\/p>`,\nlongitudinal:`<h3>Longitudinal Waves<\/h3>\n<p><b>Definition:<\/b> particles vibrate <b>parallel<\/b> to the direction the wave travels, forming compressions and rarefactions.<\/p>\n<p><b>Parts:<\/b> <span style=\"color:#f87171\">compression<\/span> (particles close together, high pressure), <span style=\"color:#60a5fa\">rarefaction<\/span> (particles spread apart, low pressure). Wavelength = compression to next compression.<\/p>\n<p><b>Examples:<\/b> sound waves, a pushed-and-pulled slinky, P-waves in earthquakes, ultrasound.<\/p>\n<p>Watch the <span style=\"color:#fde047\">yellow particle<\/span>: it moves back and forth, but does not travel with the wave.<\/p>`,\nrelation:`<h3>Wave Velocity, Frequency and Wavelength<\/h3>\n<p><b>Wavelength (\u03bb):<\/b> distance between two identical points on consecutive waves (metres).<\/p>\n<p><b>Frequency (f):<\/b> number of complete waves passing a point each second (hertz, Hz).<\/p>\n<p><b>Wave velocity (v):<\/b> distance the wave travels per second (m/s).<\/p>\n<p class=\"big\" id=\"calc\"><\/p>\n<p>Period <i>T<\/i> = 1/f. Wave speed depends on the medium: for a fixed speed, higher frequency means shorter wavelength. Change the sliders and compare the number of waves.<\/p>`,\nsl:`<h3>Sound vs Light<\/h3>\n<table>\n<tr><th>Property<\/th><th>Sound<\/th><th>Light<\/th><\/tr>\n<tr><td>Wave type<\/td><td>Longitudinal (mechanical)<\/td><td>Transverse (electromagnetic)<\/td><\/tr>\n<tr><td>Needs a medium?<\/td><td>Yes. It cannot travel in vacuum<\/td><td>No. It travels through vacuum<\/td><\/tr>\n<tr><td>Speed<\/td><td>\u2248 343 m/s in air (faster in solids)<\/td><td>\u2248 3 \u00d7 10\u2078 m/s in vacuum<\/td><\/tr>\n<tr><td>Frequency range<\/td><td>20 Hz to 20 000 Hz (audible)<\/td><td>\u2248 4\u00d710\u00b9\u2074 to 7.5\u00d710\u00b9\u2074 Hz (visible)<\/td><\/tr>\n<tr><td>Wavelength<\/td><td>\u2248 1.7 cm to 17 m<\/td><td>\u2248 400 to 700 nm<\/td><\/tr>\n<tr><td>Amplitude means<\/td><td>Loudness<\/td><td>Brightness<\/td><\/tr>\n<tr><td>Frequency means<\/td><td>Pitch<\/td><td>Colour<\/td><\/tr>\n<tr><td>Shared properties<\/td><td colspan=\"2\">Reflection (echo, mirror), refraction, diffraction, interference, and v = f\u03bb<\/td><\/tr>\n<\/table>\n<p>Top: sound (particles bunch up). Bottom: light (electric field oscillates, no particles needed). Try the pitch/colour slider and play a tone.<\/p>`\n};\n\nfunction setMode(m){\n  mode=m;\n  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.m===m));\n  $('info').innerHTML=INFO[m];\n  $('wlWrap').style.display=(m==='relation')?'':'none';\n  $('tone').style.display=(m==='sl')?'':'none';\n  $('freq').max=(m==='sl')?5:3;\n}\ndocument.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));\n$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Play':'Pause'};\n['freq','wl'].forEach(id=>$(id).oninput=()=>{$('fv').textContent=f().toFixed(1);$('wv').textContent=wl().toFixed(1)});\n\n// ---- Audio\nlet ac,osc;\n$('tone').onclick=()=>{\n  if(osc){osc.stop();osc=null;$('tone').textContent='\ud83d\udd0a Play tone';return;}\n  ac=ac||new (window.AudioContext||window.webkitAudioContext)();\n  osc=ac.createOscillator();const g=ac.createGain();\n  osc.frequency.value=200*f();g.gain.value=A()/70*0.3;\n  osc.connect(g);g.connect(ac.destination);osc.start();\n  $('tone').textContent='\u23f9 Stop tone';\n};\nsetInterval(()=>{if(osc)osc.frequency.value=200*f()},100);\n\n// ---- Drawing helpers\nfunction label(txt,x,y,col='#cbd5e1'){ctx.fillStyle=col;ctx.font='14px Segoe UI';ctx.fillText(txt,x,y)}\nfunction arrow(x1,y1,x2,y2,col){\n  ctx.strokeStyle=ctx.fillStyle=col;ctx.lineWidth=2;\n  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();\n  const a=Math.atan2(y2-y1,x2-x1);\n  ctx.beginPath();ctx.moveTo(x2,y2);\n  ctx.lineTo(x2-8*Math.cos(a-.4),y2-8*Math.sin(a-.4));\n  ctx.lineTo(x2-8*Math.cos(a+.4),y2-8*Math.sin(a+.4));ctx.fill();\n}\n\nfunction transverse(yc,lam,fr,amp,showMarks,col){\n  const k=2*Math.PI/lam, w=2*Math.PI*fr;\n  ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();\n  for(let x=0;x<=W;x++){const y=yc-amp*Math.sin(k*x-w*t);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}\n  ctx.stroke();\n  ctx.strokeStyle='#475569';ctx.setLineDash([5,5]);ctx.lineWidth=1;\n  ctx.beginPath();ctx.moveTo(0,yc);ctx.lineTo(W,yc);ctx.stroke();ctx.setLineDash([]);\n  for(let x=10;x<W;x+=lam/8){\n    const y=yc-amp*Math.sin(k*x-w*t);\n    ctx.fillStyle=(Math.abs(x-10-Math.round((x-10)/lam)*lam)<lam/16+1e-6&&showMarks)?'#f87171':'#94a3b8';\n    ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();\n  }\n  if(showMarks){ // tracked particle\n    const x0=10+Math.round(250/lam)*lam, y=yc-amp*Math.sin(k*x0-w*t);\n    ctx.fillStyle='#f87171';ctx.beginPath();ctx.arc(x0,y,8,0,7);ctx.fill();\n    ctx.strokeStyle='#f87171';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0,yc-amp);ctx.lineTo(x0,yc+amp);ctx.stroke();\n  }\n}\n\nfunction longitudinal(yc,lam,fr,amp,rows,spacing,compress){\n  const k=2*Math.PI/lam, w=2*Math.PI*fr, d=Math.min(amp*0.35,lam/4);\n  for(let r=0;r<rows;r++){\n    const y=yc+(r-(rows-1)/2)*spacing;\n    for(let x0=10;x0<W;x0+=14){\n      const ph=k*x0-w*t, x=x0+d*Math.sin(ph); // displacement\n      const dens=-Math.cos(ph); // +1 compression\n      const c=dens>0?`rgb(${150+105*dens|0},${90-60*dens|0},${90-60*dens|0})`:`rgb(${90+30*dens|0},${150+60*dens|0},255)`;\n      const tracked=(r===Math.floor(rows/2)&&Math.abs(x0-(10+14*Math.round(430/14)))<1);\n      ctx.fillStyle=tracked?'#fde047':c;\n      ctx.beginPath();ctx.arc(x,y,tracked?7:3.5,0,7);ctx.fill();\n    }\n  }\n}\n\nfunction frame(ts){\n  const dt=(ts-last)/1000;last=ts;if(!paused)t+=Math.min(dt,.05);\n  ctx.clearRect(0,0,W,H);\n  const fr=f(),amp=A();\n  if(mode==='transverse'){\n    const lam=200;\n    transverse(H/2,lam,fr,amp,true,'#38bdf8');\n    arrow(20,H-25,120,H-25,'#4ade80');label('Wave direction',130,H-20,'#4ade80');\n    label('Crest',30,H/2-amp-12,'#fde047');label('Trough',30,H/2+amp+22,'#fde047');\n    label('Amplitude',W-110,H/2-amp/2,'#fda4af');\n    arrow(W-30,H/2,W-30,H/2-amp,'#fda4af');\n    label('\u03bb = 200 px',W/2-30,30);\n    label('Particle motion: \u2191\u2193  (\u22a5 to wave)',W-290,H-20,'#f87171');\n  }else if(mode==='longitudinal'){\n    longitudinal(H/2,200,fr,amp,5,26);\n    arrow(20,H-25,120,H-25,'#4ade80');label('Wave direction',130,H-20,'#4ade80');\n    label('Particle motion: \u2190 \u2192  (\u2225 to wave)',W-310,H-20,'#fde047');\n    label('Red = compression, Blue = rarefaction',20,28);\n  }else if(mode==='relation'){\n    const lam=wl()*PX;\n    transverse(H/2,lam,fr,amp,false,'#38bdf8');\n    // wavelength marker on first crest\n    const k=2*Math.PI/lam,w=2*Math.PI*fr;\n    let x=0;for(let i=0;i<lam;i++){if(Math.sin(k*i-w*t)>.999){x=i;break}}\n    let c1=((Math.PI/2+w*t)/k)%lam;if(c1<0)c1+=lam;c1+=lam*0;\n    const cx=c1;\n    if(cx+lam<W){arrow(cx,H/2-amp-18,cx+lam,H/2-amp-18,'#fde047');arrow(cx+lam,H/2-amp-18,cx,H/2-amp-18,'#fde047');\n      label('\u03bb = '+wl().toFixed(1)+' m',cx+lam/2-30,H/2-amp-26,'#fde047');}\n    const v=fr*wl();\n    label('f = '+fr.toFixed(1)+' waves/s   T = '+(1/fr).toFixed(2)+' s',20,H-20);\n    $('calc').innerHTML=`v = f \u00d7 \u03bb = ${fr.toFixed(1)} \u00d7 ${wl().toFixed(1)} = <b>${v.toFixed(2)} m/s<\/b>`;\n  }else{\n    label('SOUND (longitudinal)  needs air/medium',20,22,'#f87171');\n    longitudinal(95,480/fr,fr*0.6,amp,3,22);\n    ctx.strokeStyle='#334155';ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();\n    label('LIGHT (transverse)  travels in vacuum, ~880,000\u00d7 faster than sound',20,H/2+22,'#fde047');\n    const lam=480/fr, k=2*Math.PI/lam, w=2*Math.PI*fr*3;\n    const hue=270-(fr-0.5)/4.5*270; // low f red -> high f violet-ish\n    const col=`hsl(${Math.max(0,hue)},90%,60%)`;\n    const yc=H/2+100;\n    for(let x=0;x<W;x+=10){\n      const y=-amp*0.8*Math.sin(k*x-w*t);\n      ctx.strokeStyle=col;ctx.lineWidth=2;\n      ctx.beginPath();ctx.moveTo(x,yc);ctx.lineTo(x,yc+y);ctx.stroke();\n    }\n    ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();\n    for(let x=0;x<=W;x++){const y=yc-amp*0.8*Math.sin(k*x-w*t);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}\n    ctx.stroke();\n    label('Higher frequency \u2192 higher pitch (sound), shifts colour (light). Bigger amplitude \u2192 louder / brighter.',20,H-12,'#94a3b8');\n  }\n  requestAnimationFrame(frame);\n}\nsetMode('transverse');\nrequestAnimationFrame(frame);\n<\/script>\n<\/body>\n<\/html>", "r": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Magnetic Materials & Quantities<\/title>\n<style>\n body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:16px}\n h1{font-size:22px;margin:0 0 10px}\n .tabs button{padding:8px 14px;margin-right:4px;border:0;border-radius:6px 6px 0 0;background:#334155;color:#fff;cursor:pointer}\n .tabs button.on{background:#2563eb}\n .panel{display:none;background:#1e293b;padding:14px;border-radius:0 8px 8px 8px}\n .panel.on{display:block}\n canvas{background:#0b1220;border-radius:8px;max-width:100%}\n label{display:inline-block;margin:6px 12px 6px 0}\n table{border-collapse:collapse;width:100%;font-size:13px;margin-top:10px}\n td,th{border:1px solid #475569;padding:5px 7px;text-align:left}\n th{background:#334155}\n .box{background:#0b1220;padding:8px 12px;border-radius:6px;margin:6px 0;font-family:monospace}\n select,input{vertical-align:middle}\n<\/style>\n<\/head>\n<body>\n<h1>\ud83e\uddf2 Magnetic Materials, Field, Intensity, Flux & Magnetization<\/h1>\n<div class=\"tabs\">\n <button class=\"on\" onclick=\"tab(0)\">1. Types of Materials<\/button>\n <button onclick=\"tab(1)\">2. Field Lines<\/button>\n <button onclick=\"tab(2)\">3. B, H, M & Flux<\/button>\n<\/div>\n\n<!-- TAB 1 -->\n<div class=\"panel on\">\n <label>Material:\n  <select id=\"mat\" onchange=\"setMat()\">\n   <option value=\"dia\">Diamagnetic<\/option>\n   <option value=\"para\" selected>Paramagnetic<\/option>\n   <option value=\"ferro\">Ferromagnetic<\/option>\n  <\/select><\/label>\n <label>Applied field H: <input type=\"range\" id=\"H1\" min=\"0\" max=\"100\" value=\"0\"> <span id=\"H1v\">0<\/span><\/label>\n <br>\n <canvas id=\"c1\" width=\"640\" height=\"320\"><\/canvas>\n <div id=\"info\" class=\"box\"><\/div>\n <table>\n  <tr><th>Property<\/th><th>Diamagnetic<\/th><th>Paramagnetic<\/th><th>Ferromagnetic<\/th><\/tr>\n  <tr><td>Atomic dipoles<\/td><td>No permanent dipoles<\/td><td>Permanent, randomly oriented<\/td><td>Permanent, aligned in domains<\/td><\/tr>\n  <tr><td>In external field<\/td><td>Weakly repelled; induced M opposes H<\/td><td>Weakly attracted; M along H<\/td><td>Strongly attracted; large M along H<\/td><\/tr>\n  <tr><td>Susceptibility \u03c7<\/td><td>Small, negative (\u2248 \u221210\u207b\u2075)<\/td><td>Small, positive (10\u207b\u2075 to 10\u207b\u00b3)<\/td><td>Large, positive (10\u00b2\u201310\u2075)<\/td><\/tr>\n  <tr><td>Relative permeability \u03bcr<\/td><td>Slightly &lt; 1<\/td><td>Slightly &gt; 1<\/td><td>&gt;&gt; 1<\/td><\/tr>\n  <tr><td>Temperature<\/td><td>Independent<\/td><td>\u03c7 \u221d 1/T (Curie law)<\/td><td>Becomes paramagnetic above Curie temp.<\/td><\/tr>\n  <tr><td>Examples<\/td><td>Bismuth, copper, water, gold<\/td><td>Aluminium, sodium, oxygen<\/td><td>Iron, cobalt, nickel<\/td><\/tr>\n <\/table>\n<\/div>\n\n<!-- TAB 2 -->\n<div class=\"panel\">\n <p>Magnetic lines of force leave the N pole, enter the S pole outside the magnet, and form closed loops (continuing inside from S to N). They never cross, and they are closer together where the field is stronger (near the poles).<\/p>\n <label><input type=\"checkbox\" id=\"spd\" checked> Animate<\/label>\n <br>\n <canvas id=\"c2\" width=\"700\" height=\"360\"><\/canvas>\n<\/div>\n\n<!-- TAB 3 -->\n<div class=\"panel\">\n <label>Material:\n  <select id=\"mat3\" onchange=\"calc()\">\n   <option value=\"-1.66e-4\">Bismuth (diamagnetic)<\/option>\n   <option value=\"2.2e-5\" selected>Aluminium (paramagnetic)<\/option>\n   <option value=\"5000\">Soft iron (ferromagnetic, approx.)<\/option>\n  <\/select><\/label>\n <label>H (A/m): <input type=\"range\" id=\"H3\" min=\"0\" max=\"1000\" value=\"500\" oninput=\"calc()\"> <span id=\"H3v\"><\/span><\/label>\n <label>Area A (cm\u00b2): <input type=\"range\" id=\"A3\" min=\"1\" max=\"100\" value=\"20\" oninput=\"calc()\"> <span id=\"A3v\"><\/span><\/label>\n <br>\n <canvas id=\"c3\" width=\"700\" height=\"260\"><\/canvas>\n <div class=\"box\" id=\"out\"><\/div>\n <div class=\"box\">\n  H = magnetic intensity (A/m): the field produced by free currents<br>\n  M = magnetization (A/m): magnetic moment per unit volume = \u03c7 H<br>\n  B = \u03bc\u2080(H + M) = \u03bc\u2080(1 + \u03c7)H = \u03bcH (tesla)<br>\n  \u03a6 = B A cos \u03b8 (weber); here \u03b8 = 0, the loop faces the field\n <\/div>\n<\/div>\n\n<script>\nconst tabs=document.querySelectorAll('.tabs button'),panels=document.querySelectorAll('.panel');\nfunction tab(i){tabs.forEach((b,j)=>b.classList.toggle('on',i==j));panels.forEach((p,j)=>p.classList.toggle('on',i==j));}\n\n/* ---------- TAB 1 ---------- */\nconst c1=document.getElementById('c1'),x1=c1.getContext('2d');\nconst dip=[];\nfor(let r=0;r<6;r++)for(let c=0;c<12;c++){\n  const d=(Math.floor(c/4))+3*Math.floor(r/3); // 6 domains\n  dip.push({x:50+c*50,y:40+r*48,a:Math.random()*6.28,wob:Math.random()*6.28,dom:d});\n}\nconst domAngle=[0,1,2,3,4,5].map(()=>Math.random()*6.28);\nconst domColor=['#f87171','#fbbf24','#34d399','#60a5fa','#a78bfa','#f472b6'];\nconst mat=()=>document.getElementById('mat').value;\nfunction setMat(){info();}\nfunction info(){\n  const m=mat(),H=+document.getElementById('H1').value;\n  document.getElementById('H1v').textContent=H;\n  const t={dia:'No permanent dipoles. Applying H induces tiny dipoles opposite to H (\u03c7 < 0). The material is weakly repelled.',\n   para:'Random permanent dipoles. H partly aligns them against thermal motion (\u03c7 small, > 0). Weakly attracted.',\n   ferro:'Domains (coloured regions) each hold aligned dipoles. H makes the domains rotate and grow along H, giving a very large M.'}[m];\n  document.getElementById('info').textContent=t;\n}\ndocument.getElementById('H1').oninput=info;info();\nfunction arrow(x,y,a,len,col){\n  x1.strokeStyle=col;x1.fillStyle=col;x1.lineWidth=2;\n  const dx=Math.cos(a)*len/2,dy=Math.sin(a)*len/2;\n  x1.beginPath();x1.moveTo(x-dx,y-dy);x1.lineTo(x+dx,y+dy);x1.stroke();\n  x1.beginPath();x1.moveTo(x+dx,y+dy);\n  x1.lineTo(x+dx-Math.cos(a-0.5)*7,y+dy-Math.sin(a-0.5)*7);\n  x1.lineTo(x+dx-Math.cos(a+0.5)*7,y+dy-Math.sin(a+0.5)*7);x1.fill();\n}\nlet t=0;\nfunction draw1(){\n  t+=0.03;const m=mat(),H=+document.getElementById('H1').value/100;\n  x1.clearRect(0,0,640,320);\n  x1.fillStyle='#94a3b8';x1.font='13px Arial';\n  x1.fillText('Applied field H  \u2192',480,312);\n  let net=0;\n  dip.forEach(d=>{\n    if(m=='ferro'){\n      x1.fillStyle=domColor[d.dom]+'22';x1.fillRect(d.x-25,d.y-24,50,48);\n      const f=Math.min(1,H*1.6);\n      let a=domAngle[d.dom]*(1-f)+0;\n      // shortest rotation to 0\n      let da=((domAngle[d.dom]+Math.PI)%(2*Math.PI))-Math.PI;\n      a=da*(1-f);\n      arrow(d.x,d.y,a,30,domColor[d.dom]);net+=Math.cos(a);\n    }else if(m=='para'){\n      const f=Math.min(1,H*0.9);\n      d.a+=0.02*Math.sin(t*3+d.wob)+0.01;\n      let da=((d.a+Math.PI)%(2*Math.PI))-Math.PI;\n      const a=da*(1-f)+0.2*Math.sin(t*4+d.wob)*(1-f)*0;\n      arrow(d.x,d.y,a+0.15*Math.sin(t*5+d.wob)*(1-f),28,'#fbbf24');net+=Math.cos(a);\n    }else{\n      if(H>0){arrow(d.x,d.y,Math.PI,6+H*16,'#60a5fa');net-=H*0.1;}\n      else{x1.fillStyle='#475569';x1.beginPath();x1.arc(d.x,d.y,4,0,6.28);x1.fill();}\n    }\n  });\n  // field arrows\n  if(H>0)for(let y=40;y<300;y+=48){x1.strokeStyle='rgba(255,255,255,'+(0.1+H*0.3)+')';x1.lineWidth=1;x1.beginPath();x1.moveTo(10,y+24);x1.lineTo(630,y+24);x1.stroke();}\n  requestAnimationFrame(draw1);\n}\ndraw1();\n\n/* ---------- TAB 2 ---------- */\nconst c2=document.getElementById('c2'),x2=c2.getContext('2d');\nlet ph=0;\nfunction pt(L,th,s){return [350+L*Math.sin(th)**2*Math.cos(th)*1*1,180+s*L*Math.sin(th)**3];}\nfunction draw2(){\n  if(document.getElementById('spd').checked)ph+=0.006;\n  x2.clearRect(0,0,700,360);\n  const Ls=[50,90,135,180,230];\n  Ls.forEach((L,i)=>{[1,-1].forEach(s=>{\n    x2.strokeStyle='#38bdf8';x2.lineWidth=1.3;x2.beginPath();\n    for(let k=0.02;k<=3.12;k+=0.02){const [x,y]=pt(L*1.1,k,s);k==0.02?x2.moveTo(x,y):x2.lineTo(x,y);}\n    x2.stroke();\n    // moving dots (N \u2192 S)\n    for(let j=0;j<4;j++){\n      const k=0.15+((ph*1+j/4+i*0.13)%1)*2.8;\n      const [x,y]=pt(L*1.1,k,s);\n      x2.fillStyle='#fde047';x2.beginPath();x2.arc(x,y,3,0,6.28);x2.fill();\n    }\n  });});\n  // magnet\n  x2.fillStyle='#ef4444';x2.fillRect(350,160,60,40);\n  x2.fillStyle='#3b82f6';x2.fillRect(290,160,60,40);\n  x2.fillStyle='#fff';x2.font='bold 18px Arial';\n  x2.fillText('S',312,187);x2.fillText('N',372,187);\n  x2.font='12px Arial';x2.fillStyle='#cbd5e1';\n  x2.fillText('Lines are denser near the poles (strong field)',20,340);\n  requestAnimationFrame(draw2);\n}\ndraw2();\n// note: red block on right drawn as N (field lines start there)\n\n/* ---------- TAB 3 ---------- */\nconst mu0=4e-7*Math.PI;\nfunction calc(){\n  const chi=+document.getElementById('mat3').value,H=+document.getElementById('H3').value,A=+document.getElementById('A3').value;\n  document.getElementById('H3v').textContent=H;document.getElementById('A3v').textContent=A;\n  const M=chi*H,B=mu0*(H+M),Phi=B*A*1e-4;\n  document.getElementById('out').innerHTML=\n   `\u03c7 = ${chi.toExponential(2)} &nbsp; \u03bcr = ${(1+chi).toPrecision(5)}<br>`+\n   `H = ${H} A/m<br>M = \u03c7H = ${M.toExponential(3)} A/m<br>`+\n   `B = \u03bc\u2080(H+M) = ${B.toExponential(3)} T<br>\u03a6 = BA = ${Phi.toExponential(3)} Wb`;\n  window.rel=1+chi;window.areaV=A;\n}\ncalc();\nconst c3=document.getElementById('c3'),x3=c3.getContext('2d');\nlet off=0;\nfunction draw3(){\n  off=(off+1.5)%20;\n  x3.clearRect(0,0,700,260);\n  const rel=Math.max(0.3,Math.min(window.rel,1+Math.log10(Math.max(1,window.rel))*3));\n  const n=Math.round(6*rel),h=window.areaV*1.8+30,cy=130;\n  // slab of material\n  x3.fillStyle='rgba(148,163,184,0.15)';x3.fillRect(200,cy-h/2-10,300,h+20);\n  x3.strokeStyle='#fde047';x3.lineWidth=3;x3.strokeRect(340,cy-h/2,20,h);\n  x3.fillStyle='#fde047';x3.font='12px Arial';x3.fillText('Area A (loop)',320,cy+h/2+22);\n  x3.fillStyle='#38bdf8';\n  for(let i=0;i<n;i++){\n    const y=cy-h/2+(i+0.5)*h/n;\n    x3.strokeStyle='#38bdf8';x3.lineWidth=1.2;x3.beginPath();x3.moveTo(40,y);x3.lineTo(660,y);x3.stroke();\n    for(let x=40+off;x<660;x+=20){x3.beginPath();x3.moveTo(x,y-3);x3.lineTo(x+6,y);x3.lineTo(x,y+3);x3.fill();}\n  }\n  x3.fillStyle='#cbd5e1';x3.fillText('Lines through loop \u221d flux \u03a6 = B\u00b7A (more lines when \u03bcr or A is larger)',40,20);\n  requestAnimationFrame(draw3);\n}\ndraw3();\n<\/script>\n<\/body>\n<\/html>"};
const frame=document.getElementById('frame'),home=document.getElementById('home');
const btns=document.querySelectorAll('#nav button');
function open(k){
  btns.forEach(b=>b.classList.toggle('active',b.dataset.k===k));
  home.style.display='none';frame.style.display='block';
  frame.srcdoc=PAGES[k];
  history.replaceState(null,'','#'+k);
}
btns.forEach(b=>b.onclick=()=>open(b.dataset.k));
const h=location.hash.slice(1);
if(PAGES[h])open(h);
</script>
